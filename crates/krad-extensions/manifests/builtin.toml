[[language]]
id = "typescript"
name = "TypeScript"
extensions = ["ts", "mts", "cts"]
line_comment = "//"
grammar = "typescript"
syntax = "typescript"
server = "vtsls"

[[language.templates]]
id = "module"
label = "Module"
group = "TypeScript"
file = "{{name}}.ts"
body = "$0\n"
markers = ["package.json", "tsconfig.json"]

[[language.templates]]
id = "test"
label = "Test"
group = "TypeScript"
file = "{{name}}.test.ts"
body = "describe(\"{{name}}\", () => {\n  it(\"works\", () => {\n    $0\n  });\n});\n"
markers = ["package.json", "tsconfig.json"]

[[language]]
id = "tsx"
name = "TypeScript"
extensions = ["tsx"]
line_comment = "//"
grammar = "tsx"
syntax = "typescript"
