[[server]]
package = "rust-analyzer"
probe = ["--version"]
server_runtimes = ["rust"]
settings_section = "rust-analyzer"
project_check = "pushed"

[server.settings]
checkOnSave = true

[server.settings.diagnostics.experimental]
enable = true

[server.toolchain]
family = "rust"
apply = "restart"
path = ["{{toolchain.dir}}"]

[[server]]
package = "vtsls"
args = ["--stdio"]

[server.toolchain]
family = "typescript"
apply = "restart"

[server.toolchain.settings]
"typescript.tsdk" = "{{toolchain.path}}"

[[server.toolchain.defaults]]
key = "vtsls.autoUseWorkspaceTsdk"
value = false

[[server]]
package = "basedpyright"
bin = "basedpyright-langserver"
args = ["--stdio"]
server_runtimes = ["python"]

[server.toolchain]
family = "python"
apply = "live"

[server.toolchain.settings]
"python.pythonPath" = "{{toolchain.path}}"

[[server.toolchain.defaults]]
key = "basedpyright.analysis.typeCheckingMode"
value = "standard"
unless_project_config = [
  { file = "pyrightconfig.json" },
  { file = "pyproject.toml", table = "tool.basedpyright" },
  { file = "pyproject.toml", table = "tool.pyright" },
]

[[server]]
package = "gopls"
project_check = "pushed"

[server.toolchain]
family = "go"
apply = "restart"
path = ["{{toolchain.dir}}"]

[server.toolchain.env]
GOROOT = "{{toolchain.prefix}}"

[[server]]
package = "clangd"

[[server]]
package = "html-lsp"
bin = "vscode-html-language-server"
args = ["--stdio"]

[server.settings]
provideFormatter = true

[server.settings.embeddedLanguages]
css = true
javascript = true

[[server]]
package = "css-lsp"
bin = "vscode-css-language-server"
args = ["--stdio"]

[server.settings]
provideFormatter = true

[[server]]
package = "svelte-language-server"
bin = "svelteserver"
args = ["--stdio"]

[[server]]
package = "json-lsp"
bin = "vscode-json-language-server"
args = ["--stdio"]

[[server]]
package = "yaml-language-server"
args = ["--stdio"]

[[server]]
package = "taplo"
args = ["lsp", "stdio"]

[[server]]
package = "lemminx"

[[server]]
package = "kotlin-lsp"
bin = "intellij-server"
args = ["--stdio"]
path_names = ["kotlin-lsp"]
server_runtimes = ["java"]

[[server]]
package = "jdtls"
project_check = "pushed"
server_runtimes = ["java"]
path_names = []
command = [
  "{{server_runtime.java}}",
  "-Declipse.application=org.eclipse.jdt.ls.core.id1",
  "-Dosgi.bundles.defaultStartLevel=4",
  "-Declipse.product=org.eclipse.jdt.ls.core.product",
  "-Dosgi.checkConfiguration=true",
  "-Dosgi.sharedConfiguration.area={{dir}}/{{source.download.config}}",
  "-Dosgi.sharedConfiguration.area.readOnly=true",
  "-Dosgi.configuration.cascaded=true",
  "-Djava.import.generatesMetadataFilesAtProjectRoot=false",
  "-Xms1G",
  "--add-modules=ALL-SYSTEM",
  "--add-opens",
  "java.base/java.util=ALL-UNNAMED",
  "--add-opens",
  "java.base/java.lang=ALL-UNNAMED",
  "-jar",
  "{{ \"plugins/org.eclipse.equinox.launcher_*.jar\" | glob }}",
  "-nosplash",
  "-data",
  "{{workspace}}",
]

[server.toolchain]
family = "java"
apply = "restart"

[server.toolchain.env]
JAVA_HOME = "{{toolchain.prefix}}"

[[server]]
package = "intelephense"
args = ["--stdio"]

[[server]]
package = "ruby-lsp"
server_runtimes = ["ruby"]

[server.toolchain]
family = "ruby"
apply = "restart"
path = ["{{toolchain.dir}}"]

[[server]]
package = "graphql-language-service-cli"
bin = "graphql-lsp"
args = ["server", "-m", "stream"]

[[server]]
package = "sourcekit-lsp"
path_names = ["sourcekit-lsp"]

[[server]]
package = "csharp-language-server"
bin = "csharp-ls"

[[server_runtime]]
id = "node"
name = "Node.js"
program = "node"
version_args = ["--version"]
minimum_version = 22

[[server_runtime.download]]
targets = ["darwin_arm64"]
url = "https://nodejs.org/dist/v24.22.1/node-v24.22.1-darwin-arm64.tar.gz"
sha256_list = "https://nodejs.org/dist/v24.22.1/SHASUMS256.txt"

[[server_runtime.download]]
targets = ["darwin_x64"]
url = "https://nodejs.org/dist/v24.22.1/node-v24.22.1-darwin-x64.tar.gz"
sha256_list = "https://nodejs.org/dist/v24.22.1/SHASUMS256.txt"

[[server_runtime.download]]
targets = ["linux_arm64"]
url = "https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-arm64.tar.gz"
sha256_list = "https://nodejs.org/dist/v24.22.1/SHASUMS256.txt"

[[server_runtime.download]]
targets = ["linux_x64"]
