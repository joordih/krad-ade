sha256_list = "https://nodejs.org/dist/v24.22.1/SHASUMS256.txt"

[[server_runtime.manager]]
kind = "npm"
install = [
  [
    "{{server_runtime_dir}}/npm{{cmd}}",
    "install",
    "--prefix",
    "{{dir}}",
    "--no-package-lock",
    "--no-save",
    "--no-audit",
    "--no-fund",
    "{{package}}@{{version}}",
  ],
]
bin = "{{dir}}/node_modules/.bin/{{bin}}{{cmd}}"

[[server_runtime.runner]]
kind = "node"
command = ["{{server_runtime}}", "{{dir}}/{{bin}}"]

