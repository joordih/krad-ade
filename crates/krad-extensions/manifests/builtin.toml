[[server_runtime.manager]]
kind = "pypi"
install = [
  [
    "{{server_runtime}}",
    "-m",
    "venv",
    "{{dir}}/venv",
  ],
  [
    "{{dir}}/venv/bin/python",
    "-m",
    "pip",
    "install",
    "--quiet",
    "{{package}}{{extra}}=={{version}}",
  ],
]
windows_install = [
  [
    "{{server_runtime}}",
    "-m",
    "venv",
    "{{dir}}/venv",
  ],
  [
    "{{dir}}/venv/Scripts/python.exe",
    "-m",
    "pip",
    "install",
    "--quiet",
    "{{package}}{{extra}}=={{version}}",
  ],
]
bin = "{{dir}}/venv/bin/{{bin}}"
windows_bin = "{{dir}}/venv/Scripts/{{bin}}.exe"

[[server_runtime.runner]]
kind = "python"
command = ["{{server_runtime}}", "{{dir}}/{{bin}}"]

[[server_runtime]]
id = "ruby"
name = "Ruby"
program = "ruby"
version_args = ["--version"]

[[server_runtime.manager]]
kind = "gem"
install = [
  [
    "{{server_runtime_dir}}/gem{{cmd}}",
    "install",
    "--install-dir",
    "{{dir}}",
    "--bindir",
    "{{dir}}/bin",
    "--no-document",
    "{{package}}:{{version}}",
  ],
]
env = { GEM_HOME = "{{dir}}" }
bin = "{{dir}}/bin/{{bin}}{{cmd}}"
