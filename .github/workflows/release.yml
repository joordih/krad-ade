name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release instead of the next patch, such as 0.4.0
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  KRAD_GITHUB_CLIENT_ID: ${{ secrets.KRAD_GITHUB_CLIENT_ID }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - id: bump
        name: Pick the version, the next patch rolling over to the next minor after 9 unless one is requested
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          last_patch=9
          current=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ -n "$REQUESTED" ]; then
            if ! [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$REQUESTED is not a major.minor.patch version"
              exit 1
            fi
            newest=$(printf '%s\n%s\n' "$current" "$REQUESTED" | sort -V | tail -n1)
            if [ "$newest" != "$REQUESTED" ] || [ "$current" = "$REQUESTED" ]; then
              echo "::error::$REQUESTED must be newer than $current"
              exit 1
            fi
            version="$REQUESTED"
          else
            IFS=. read -r major minor patch <<< "$current"
            patch=$((patch + 1))
            if [ "$patch" -gt "$last_patch" ]; then
              patch=0
              minor=$((minor + 1))
            fi
            version="$major.$minor.$patch"
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$version is already released"
            exit 1
          fi
          echo "Releasing $version after $current"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Write the version to Cargo.toml and Cargo.lock
        env:
          CURRENT: ${{ steps.bump.outputs.current }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          sed -i "0,/^version = \"$CURRENT\"/s//version = \"$VERSION\"/" Cargo.toml
          members=$(grep -l '^version.workspace = true' crates/*/Cargo.toml \
            | xargs -n1 grep -m1 '^name = ' | cut -d '"' -f2)
          python3 - "$CURRENT" "$VERSION" $members <<'EOF'
          import re
          import sys

          current, version, *members = sys.argv[1:]
          names = set(members)
          with open("Cargo.lock") as lock:
              blocks = lock.read().split("[[package]]")
          for index, block in enumerate(blocks):
              name = re.search(r'^name = "([^"]+)"', block, re.MULTILINE)
              if name and name.group(1) in names:
                  blocks[index] = block.replace(f'version = "{current}"', f'version = "{version}"', 1)
          with open("Cargo.lock", "w") as lock:
              lock.write("[[package]]".join(blocks))
          EOF
          git diff --stat
      - name: Check the lockfile still matches
        run: cargo metadata --locked --format-version 1 > /dev/null
      - id: commit
        name: Commit the release version to main
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux-agents:
    needs: version
    uses: ./.github/workflows/linux-agents.yml
    with:
      upload: true
      ref: ${{ needs.version.outputs.sha }}

  linux:
    name: Linux (${{ matrix.arch }})
    needs: [version, linux-agents]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Install GPUI's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: hashFiles('packaging/ghostty-vt/package.sh') != ''
        run: just ghostty-libs ${{ matrix.target }}
      - run: cargo build --release --locked -p krad-app --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          pattern: agents-*
          path: target/agents
      - name: Lay out the Linux agents CLI for SSH hosts
        run: |
          for folder in target/agents/agents-*; do
            platform="target/agents/${folder##*/agents-}"
            rm -rf "$platform"
            mv "$folder" "$platform"
          done
          chmod +x target/agents/*/krad-ade-agents
      - name: Package
        run: |
          name=krad-ade-${{ needs.version.outputs.version }}-${{ matrix.arch }}-linux
          release=target/${{ matrix.target }}/release
          mkdir -p "$name/licenses"
          cp "$release/krad-ade" "$release/krad" "$release/krad-ade-agents" packaging/linux/krad-ade.desktop "$name/"
          cp -R target/agents "$name/agents"
          cp packaging/update/krad-ade.install "$name/"
          cp packaging/icon/png/krad-ade-256.png "$name/krad-ade.png"
          shopt -s nullglob
          cp assets/icons/LICENSE-*.txt assets/fonts/*.txt "$name/licenses/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: krad-ade-*-${{ matrix.arch }}-linux.tar.gz

  windows:
    needs: [version, linux-agents]
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      PKG_CONFIG: pkgconf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
      - run: echo '${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin' >> "$GITHUB_PATH"
      - run: rustup set default-host x86_64-pc-windows-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - if: hashFiles('packaging/ghostty-vt/package.sh') != ''
        run: just ghostty-libs x86_64-pc-windows-gnu
      - if: hashFiles('packaging/windows/LICENSE-conpty.txt') != ''
        run: just conpty
      - run: cargo build --release --locked -p krad-app
      - uses: actions/download-artifact@v4
        with:
          pattern: agents-*
          path: target/agents
      - name: Lay out the Linux agents CLI for SSH hosts
        run: |
          for folder in target/agents/agents-*; do
            platform="target/agents/${folder##*/agents-}"
            rm -rf "$platform"
            mv "$folder" "$platform"
          done
          chmod +x target/agents/*/krad-ade-agents
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.version.outputs.version }}" installer\krad-ade.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/installer/krad-ade-*-setup.exe

  macos:
    name: macOS (${{ matrix.arch }})
    needs: [version, linux-agents]
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    env:
      PKG_CONFIG_ALLOW_CROSS: "1"
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - run: just ghostty-libs ${{ matrix.target }}
      - run: cargo build --release --locked -p krad-app --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          pattern: agents-*
          path: target/agents
      - name: Lay out the Linux agents CLI for SSH hosts
        run: |
          for folder in target/agents/agents-*; do
            platform="target/agents/${folder##*/agents-}"
            rm -rf "$platform"
            mv "$folder" "$platform"
          done
          chmod +x target/agents/*/krad-ade-agents
      - name: Import the Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Bundle Krad ADE.app
        run: |
          version=${{ needs.version.outputs.version }}
          app="dmg/Krad ADE.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/licenses"
          release=target/${{ matrix.target }}/release
          cp "$release/krad-ade" "$release/krad" "$release/krad-ade-agents" "$app/Contents/MacOS/"
          cp packaging/macos/krad-ade.icns packaging/update/krad-ade.install "$app/Contents/Resources/"
          cp -R target/agents "$app/Contents/Resources/agents"
          cp assets/icons/LICENSE-*.txt assets/fonts/*.txt "$app/Contents/Resources/licenses/"
          cp packaging/macos/Info.plist "$app/Contents/"
          plutil -replace CFBundleShortVersionString -string "$version" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$version" "$app/Contents/Info.plist"
      - name: Sign Krad ADE.app with the Developer ID
        if: env.MACOS_SIGNING_IDENTITY != ''
        run: |
          app="dmg/Krad ADE.app"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" \
            "$app/Contents/MacOS/krad" "$app/Contents/MacOS/krad-ade-agents"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"
      - name: Sign Krad ADE.app ad hoc
        if: env.MACOS_SIGNING_IDENTITY == ''
        run: |
          echo "::warning::No Developer ID configured; Gatekeeper will block the downloaded app"
          codesign --force --deep --sign - "dmg/Krad ADE.app"
      - name: Create the DMG
        run: |
          dmg="krad-ade-${{ needs.version.outputs.version }}-${{ matrix.arch }}-macos.dmg"
          headroom_mb=64
          attempts=5
          wait_seconds=10
          ln -s /Applications dmg/Applications
          content_mb=$(du -sm dmg | cut -f1)
          for attempt in $(seq 1 "$attempts"); do
            if hdiutil create -volname "Krad ADE" -srcfolder dmg -fs HFS+ \
              -size "$((content_mb + headroom_mb))m" -format UDZO "$dmg"; then
              break
            fi
            rm -f "$dmg"
            if [ "$attempt" -eq "$attempts" ]; then
              echo "::error::hdiutil could not create the DMG after $attempts attempts"
              exit 1
            fi
            echo "::warning::hdiutil failed (attempt $attempt of $attempts); retrying in ${wait_seconds}s"
            sleep "$wait_seconds"
          done
          if [ -n "$MACOS_SIGNING_IDENTITY" ]; then
            codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dmg"
          fi
      - name: Notarize and staple the DMG
        if: env.MACOS_SIGNING_IDENTITY != '' && env.APPLE_ID != ''
        run: |
          dmg="krad-ade-${{ needs.version.outputs.version }}-${{ matrix.arch }}-macos.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler staple "dmg/Krad ADE.app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
      - name: Archive Krad ADE.app for in-app updates
        run: |
          tar -czf "krad-ade-${{ needs.version.outputs.version }}-${{ matrix.arch }}-macos.app.tar.gz" -C dmg "Krad ADE.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            krad-ade-*-${{ matrix.arch }}-macos.dmg
            krad-ade-*-${{ matrix.arch }}-macos.app.tar.gz

  release:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign the builds into the update manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          version=${{ needs.version.outputs.version }}
          key="$RUNNER_TEMP/krad-ade.key"
          printf 'krad-ade\n%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          sign() {
            minisign -S -s "$key" -m "$1" -x "$1.minisig" -t "krad-ade $version" > /dev/null
            tail -n +2 "$1.minisig"
            rm "$1.minisig"
          }
          build() {
            jq -n --arg file "$1" --argjson size "$(stat -c %s "$1")" --arg signature "$(sign "$1")" \
              '{file: $file, size: $size, signature: $signature}'
          }
          jq -n --arg version "$version" \
            --argjson macos "$(build "krad-ade-$version-aarch64-macos.app.tar.gz")" \
            --argjson macos_intel "$(build "krad-ade-$version-x86_64-macos.app.tar.gz")" \
            --argjson windows "$(build "krad-ade-$version-setup.exe")" \
            --argjson linux "$(build "krad-ade-$version-x86_64-linux.tar.gz")" \
            --argjson linux_arm "$(build "krad-ade-$version-aarch64-linux.tar.gz")" \
            '{version: $version,
              builds: {"aarch64-macos": $macos, "x86_64-windows": $windows, "x86_64-linux": $linux},
              targets: {"aarch64-macos": $macos, "x86_64-macos": $macos_intel, "x86_64-windows": $windows,
                "x86_64-linux": $linux, "aarch64-linux": $linux_arm}}' \
            > latest.json
          sign latest.json > latest.json.sig
          rm "$key"
      - run: |
          version=${{ needs.version.outputs.version }}
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "${{ needs.version.outputs.sha }}" \
            --title "Krad ADE $version" --generate-notes krad-ade-* latest.json latest.json.sig
