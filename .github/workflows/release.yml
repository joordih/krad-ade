name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  KRAD_GITHUB_CLIENT_ID: ${{ secrets.KRAD_GITHUB_CLIENT_ID }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read the version and check it is not released yet
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$version is already released; bump the version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - if: hashFiles('packaging/ghostty-vt/package.sh') != ''
        run: just ghostty-libs x86_64-unknown-linux-gnu
      - run: cargo build --release --locked -p krad-app
      - name: Package
        run: |
          name=krad-ade-${{ needs.version.outputs.version }}-x86_64-linux
          mkdir -p "$name/licenses"
          cp target/release/krad-ade target/release/krad-ade-agents packaging/linux/krad-ade.desktop "$name/"
          cp packaging/update/krad-ade.install "$name/"
          cp packaging/icon/png/krad-ade-256.png "$name/krad-ade.png"
          shopt -s nullglob
          cp assets/icons/LICENSE-*.txt assets/fonts/*.txt "$name/licenses/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: krad-ade-*-x86_64-linux.tar.gz

  windows:
    needs: version
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      PKG_CONFIG: pkgconf
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
      - run: echo '${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin' >> "$GITHUB_PATH"
      - run: rustup set default-host x86_64-pc-windows-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - if: hashFiles('packaging/ghostty-vt/package.sh') != ''
        run: just ghostty-libs x86_64-pc-windows-gnu
      - if: hashFiles('packaging/windows/LICENSE-conpty.txt') != ''
        run: just conpty
      - run: cargo build --release --locked -p krad-app
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.version.outputs.version }}" installer\krad-ade.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/installer/krad-ade-*-setup.exe

  macos:
    needs: version
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just ghostty-libs aarch64-apple-darwin
      - run: cargo build --release --locked -p krad-app
      - name: Import the Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Bundle Krad ADE.app
        run: |
          version=${{ needs.version.outputs.version }}
          app="dmg/Krad ADE.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/licenses"
          cp target/release/krad-ade target/release/krad-ade-agents "$app/Contents/MacOS/"
          cp packaging/macos/krad-ade.icns packaging/update/krad-ade.install "$app/Contents/Resources/"
          cp assets/icons/LICENSE-*.txt assets/fonts/*.txt "$app/Contents/Resources/licenses/"
          cp packaging/macos/Info.plist "$app/Contents/"
          plutil -replace CFBundleShortVersionString -string "$version" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$version" "$app/Contents/Info.plist"
      - name: Sign Krad ADE.app with the Developer ID
        if: env.MACOS_SIGNING_IDENTITY != ''
        run: |
          app="dmg/Krad ADE.app"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" \
            "$app/Contents/MacOS/krad-ade-agents"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"
      - name: Sign Krad ADE.app ad hoc
        if: env.MACOS_SIGNING_IDENTITY == ''
        run: |
          echo "::warning::No Developer ID configured; Gatekeeper will block the downloaded app"
          codesign --force --deep --sign - "dmg/Krad ADE.app"
      - name: Create the DMG
        run: |
          dmg="krad-ade-${{ needs.version.outputs.version }}-aarch64-macos.dmg"
          headroom_mb=64
          ln -s /Applications dmg/Applications
          content_mb=$(du -sm dmg | cut -f1)
          hdiutil create -volname "Krad ADE" -srcfolder dmg -fs HFS+ \
            -size "$((content_mb + headroom_mb))m" -format UDZO "$dmg"
          if [ -n "$MACOS_SIGNING_IDENTITY" ]; then
            codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dmg"
          fi
      - name: Notarize and staple the DMG
        if: env.MACOS_SIGNING_IDENTITY != '' && env.APPLE_ID != ''
        run: |
          dmg="krad-ade-${{ needs.version.outputs.version }}-aarch64-macos.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler staple "dmg/Krad ADE.app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
      - name: Archive Krad ADE.app for in-app updates
        run: |
          tar -czf "krad-ade-${{ needs.version.outputs.version }}-aarch64-macos.app.tar.gz" -C dmg "Krad ADE.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            krad-ade-*-aarch64-macos.dmg
            krad-ade-*-aarch64-macos.app.tar.gz

  release:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign the builds into the update manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          version=${{ needs.version.outputs.version }}
          key="$RUNNER_TEMP/krad-ade.key"
          printf 'krad-ade\n%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          sign() {
            minisign -S -s "$key" -m "$1" -x "$1.minisig" -t "krad-ade $version" > /dev/null
            tail -n +2 "$1.minisig"
            rm "$1.minisig"
          }
          build() {
            jq -n --arg file "$1" --argjson size "$(stat -c %s "$1")" --arg signature "$(sign "$1")" \
              '{file: $file, size: $size, signature: $signature}'
          }
          jq -n --arg version "$version" \
            --argjson macos "$(build "krad-ade-$version-aarch64-macos.app.tar.gz")" \
            --argjson windows "$(build "krad-ade-$version-setup.exe")" \
            --argjson linux "$(build "krad-ade-$version-x86_64-linux.tar.gz")" \
            '{version: $version, builds: {"aarch64-macos": $macos, "x86_64-windows": $windows, "x86_64-linux": $linux}}' \
            > latest.json
          sign latest.json > latest.json.sig
          rm "$key"
      - run: |
          version=${{ needs.version.outputs.version }}
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Krad ADE $version" --generate-notes krad-ade-* latest.json latest.json.sig
