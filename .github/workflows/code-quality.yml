name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  GH_TOKEN: ${{ github.token }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just,taplo
      - run: just format-check
      - run: taplo fmt --check

  check:
    name: Lint and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: ${{ matrix.rustc-wrapper }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustc-wrapper: sccache
          - name: macos
            os: macos-15
            target: aarch64-apple-darwin
            rustc-wrapper: sccache
          - name: windows
            os: windows-2022
            target: x86_64-pc-windows-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install GPUI's build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
      - name: Use the MSYS2 GNU toolchain
        if: runner.os == 'Windows'
        run: |
          echo '${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin' >> "$GITHUB_PATH"
          echo "PKG_CONFIG=pkgconf" >> "$GITHUB_ENV"
          rustup set default-host x86_64-pc-windows-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: mozilla-actions/sccache-action@v0.0.11
        if: matrix.rustc-wrapper == 'sccache'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just ghostty-libs ${{ matrix.target }}
      - run: just lint
      - run: cargo test --workspace --locked
